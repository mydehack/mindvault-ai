services:
  - type: web
    name: progress-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: GEMINI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
